name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned while ubuntu-latest moves to 26.04 (actions/runner-images#14748).
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test